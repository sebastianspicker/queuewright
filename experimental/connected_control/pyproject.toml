[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuewright-connected-control-experimental"
version = "0.1.0a1"
description = "Experimental isolated connected-control primitives for Queuewright"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["queuewright_control*"]

[tool.setuptools.package-data]
"queuewright_control" = ["schemas/*.json"]
