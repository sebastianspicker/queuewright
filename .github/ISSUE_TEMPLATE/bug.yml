name: Bug report
description: Report reproducible Queuewright behavior that differs from its documented contract.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, tenant URLs, customer data, or exported live configuration.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the exact error text when safe.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest secret-free steps or fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, and browser versions
    validations:
      required: true
