name: Pages demo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - studio-ui/**
      - studio/catalog/**
      - studio/templates/university/**
      - profiles/example/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: npm ci
        working-directory: studio-ui
      - run: npm run build:demo
        working-directory: studio-ui
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v4.0.0
        with:
          path: studio-ui/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f989a8ba7e73ce09a2f8a2693e39d6d8c0ae7c4 # v4.0.5
