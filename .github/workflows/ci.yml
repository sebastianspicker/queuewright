name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install --requirement requirements-control.txt
      - run: python3 -m queuewright self-test
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify_repo.py
      - run: bash scripts/verify_git_ignores.sh
